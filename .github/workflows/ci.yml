name: CI Monorepo

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  quality:
    name: Lint, Typecheck, Build & TDD Scoring Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Generate Prisma Client
        run: pnpm --filter @arriendos/backend prisma:generate

      - name: Build packages & apps
        run: pnpm build

      - name: Lint monorepo (incl. module boundaries)
        run: pnpm lint

      - name: Typecheck monorepo
        run: pnpm typecheck

      - name: Run unit tests & Scoring coverage gate (>=80%)
        run: pnpm test
