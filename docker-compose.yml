services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: arriendos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arriendos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arriendos_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-arriendos_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arriendos -d arriendos_db']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: arriendos-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin123}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: arriendos-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123;
      mc mb -p local/arriendos-photos-cdn;
      mc anonymous set download local/arriendos-photos-cdn;
      mc mb -p local/arriendos-kyc-vault;
      mc anonymous set none local/arriendos-kyc-vault;
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:
